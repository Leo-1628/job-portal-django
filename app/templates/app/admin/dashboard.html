{% extends "app/admin/admin_base.html" %}
{% block content %}
<h4 class="mb-4">Dashboard</h4>
<div class="row">
    <div class="col-xl-3 col-md-6 mb-4">
        <div class="card border-left-primary shadow h-100 py-2">
            <div class="card-body"><div class="row no-gutters align-items-center">
                <div class="col mr-2"><div class="text-xs fw-bold text-primary text-uppercase mb-1">Total Users</div><div class="h5 mb-0 fw-bold text-gray-800">{{ master_count }}</div></div>
                <div class="col-auto"><i class="fas fa-users fa-2x text-gray-300"></i></div>
            </div></div>
        </div>
    </div>
    <div class="col-xl-3 col-md-6 mb-4">
        <div class="card border-left-success shadow h-100 py-2">
            <div class="card-body"><div class="row no-gutters align-items-center">
                <div class="col mr-2"><div class="text-xs fw-bold text-success text-uppercase mb-1">Companies</div><div class="h5 mb-0 fw-bold text-gray-800">{{ company_count }}</div></div>
                <div class="col-auto"><i class="fas fa-building fa-2x text-gray-300"></i></div>
            </div></div>
        </div>
    </div>
    <div class="col-xl-3 col-md-6 mb-4">
        <div class="card border-left-info shadow h-100 py-2">
            <div class="card-body"><div class="row no-gutters align-items-center">
                <div class="col mr-2"><div class="text-xs fw-bold text-info text-uppercase mb-1">Candidates</div><div class="h5 mb-0 fw-bold text-gray-800">{{ candidate_count }}</div></div>
                <div class="col-auto"><i class="fas fa-user-graduate fa-2x text-gray-300"></i></div>
            </div></div>
        </div>
    </div>
    <div class="col-xl-3 col-md-6 mb-4">
        <div class="card border-left-warning shadow h-100 py-2">
            <div class="card-body"><div class="row no-gutters align-items-center">
                <div class="col mr-2"><div class="text-xs fw-bold text-warning text-uppercase mb-1">Jobs Posted</div><div class="h5 mb-0 fw-bold text-gray-800">0</div></div>
                <div class="col-auto"><i class="fas fa-briefcase fa-2x text-gray-300"></i></div>
            </div></div>
        </div>
    </div>
</div>
<div class="card shadow mt-3"><div class="card-body text-center p-5">
    <i class="fas fa-chart-area fa-3x text-primary mb-3"></i>
    <h5>Welcome to Admin Panel</h5>
    <p class="text-muted">Manage users, companies and candidates from here.</p>
</div></div>
{% endblock %}
