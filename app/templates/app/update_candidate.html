{% extends "app/base1.html" %}
{% block content %}
<div class="container" style="margin-top:120px; margin-bottom:50px;">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <h3>Update Candidate Profile</h3>
      <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        <label>First Name</label>
        <input type="text" name="firstname" value="{{ profile.firstname }}" class="form-control" required>
        
        <label>Last Name</label>
        <input type="text" name="lastname" value="{{ profile.lastname }}" class="form-control" required>
        
        <label>Contact</label>
        <input type="text" name="contact" value="{{ profile.contact }}" class="form-control" required>
        
        <label>City</label>
        <input type="text" name="city" value="{{ profile.city }}" class="form-control" required>
        
        <label>State</label>
        <input type="text" name="state" value="{{ profile.state }}" class="form-control" required>
        
        <label>Address</label>
        <textarea name="address" class="form-control" required>{{ profile.address }}</textarea>
        
        <label>Current Photo</label><br>
        {% if profile.profile_pic %}
        <img src="{{ profile.profile_pic.url }}" width="100"><br><br>
        {% endif %}
        <label>Change Photo (optional)</label>
        <input type="file" name="profile_pic" class="form-control">
        <br>
        <button type="submit" class="btn btn-success btn-block">Update Profile</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
