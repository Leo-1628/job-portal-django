{% extends "app/admin/admin_base.html" %}
{% block content %}
<h4 class="mb-3">Post New Job</h4>
<div class="card shadow">
<div class="card-body">
<form method="POST">
    {% csrf_token %}
    <div class="row">
        <div class="col-md-6 mb-3"><label>Job Title</label><input type="text" name="title" class="form-control" placeholder="e.g. Python Developer" required></div>
        <div class="col-md-6 mb-3"><label>Location</label><input type="text" name="location" class="form-control" placeholder="e.g. Chennai / Remote" required></div>
        <div class="col-md-6 mb-3"><label>Salary</label><input type="text" name="salary" class="form-control" placeholder="e.g. 5 LPA or 30000/month" required></div>
        <div class="col-md-3 mb-3"><label>Job Type</label>
            <select name="job_type" class="form-control" required>
                <option>Full Time</option><option>Part Time</option><option>Internship</option><option>Contract</option>
            </select>
        </div>
        <div class="col-md-3 mb-3"><label>Vacancy</label><input type="number" name="vacancy" class="form-control" value="1" required></div>
        <div class="col-md-6 mb-3"><label>Experience Required</label><input type="text" name="experience" class="form-control" placeholder="e.g. 0-2 Years" required></div>
        <div class="col-md-6 mb-3"><label>Skills Required</label><input type="text" name="skills" class="form-control" placeholder="e.g. Python, Django, SQL" required></div>
        <div class="col-md-12 mb-3"><label>Job Description</label><textarea name="description" rows="5" class="form-control" placeholder="Describe role, responsibilities..." required></textarea></div>
    </div>
    <button type="submit" class="btn btn-primary"><i class="fas fa-paper-plane"></i> Post Job</button>
    <a href="{% url 'company_my_jobs' %}" class="btn btn-secondary">View My Jobs</a>
</form>
</div>
</div>
{% endblock %}
