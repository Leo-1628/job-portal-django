{% extends "app/base1.html" %}
{% block content %}
<div class="container" style="margin-top:120px; margin-bottom:50px;">
  <div class="row justify-content-center"><div class="col-md-8">
    <h3>Update Company Profile</h3>
    <form method="POST" enctype="multipart/form-data">
      {% csrf_token %}
      <label>First Name</label>
      <input type="text" name="firstname" value="{{ profile.firstname }}" class="form-control" required><br>
      <label>Last Name</label>
      <input type="text" name="lastname" value="{{ profile.lastname }}" class="form-control" required><br>
      <label>Company Name</label>
      <input type="text" name="company_name" value="{{ profile.company_name }}" class="form-control" required><br>
      <label>Contact</label>
      <input type="text" name="contact" value="{{ profile.contact }}" class="form-control" required><br>
      <label>City</label>
      <input type="text" name="city" value="{{ profile.city }}" class="form-control" required><br>
      <label>State</label>
      <input type="text" name="state" value="{{ profile.state }}" class="form-control" required><br>
      <label>Address</label>
      <textarea name="address" class="form-control" required>{{ profile.address }}</textarea><br>
      {% if profile.logo_pic %}<img src="{{ profile.logo_pic.url }}" width="100"><br><br>{% endif %}
      <label>Change Logo</label>
      <input type="file" name="logo_pic" class="form-control"><br>
      <button class="btn btn-success btn-block">Update</button>
    </form>
  </div></div>
</div>
{% endblock %}
