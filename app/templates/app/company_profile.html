{% extends "app/base1.html" %}
{% block content %}
<div class="container" style="margin-top:100px; margin-bottom:50px;">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <h3>Create Company Profile</h3>
      <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="row">
          <div class="col-md-6"><label>First Name</label><input type="text" name="firstname" class="form-control" required></div>
          <div class="col-md-6"><label>Last Name</label><input type="text" name="lastname" class="form-control" required></div>
          <div class="col-md-12"><label>Company Name</label><input type="text" name="company_name" class="form-control" required></div>
          <div class="col-md-6"><label>Contact</label><input type="text" name="contact" class="form-control" required></div>
          <div class="col-md-6"><label>Logo</label><input type="file" name="logo_pic" class="form-control" required></div>
          <div class="col-md-6"><label>State</label><input type="text" name="state" class="form-control" required></div>
          <div class="col-md-6"><label>City</label><input type="text" name="city" class="form-control" required></div>
          <div class="col-md-12"><label>Address</label><textarea name="address" class="form-control" required></textarea></div>
        </div>
        <br>
        <button type="submit" class="btn btn-primary btn-block">Save Company Profile</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
